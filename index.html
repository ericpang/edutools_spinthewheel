<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Upload a class photo and spin a wheel made of your students' faces. Everything stays on your device.">
<title>Spin The Wheel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%234338ca'/%3E%3Cpath d='M16 16V3a13 13 0 0 1 11.3 6.5z' fill='%23f59e0b'/%3E%3Cpath d='M16 16l11.3-6.5A13 13 0 0 1 27.3 22.5z' fill='%2310b981'/%3E%3Cpath d='M16 16l11.3 6.5A13 13 0 0 1 16 29z' fill='%23ec4899'/%3E%3Ccircle cx='16' cy='16' r='4' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/review.css">
<link rel="stylesheet" href="css/wheel.css">
<link rel="stylesheet" href="css/popout.css">
<link rel="stylesheet" href="css/pair.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.2c-.8.5-1.2 1-1.2 2M12 17h.01"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-exit-fit" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
  <symbol id="i-zoom" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2M11 8.5v5M8.5 11h5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></symbol>
  <symbol id="i-spin" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/></symbol>
  <symbol id="i-user-minus" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0M17 11h5"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4 3 20h18L12 4zM12 10v4M12 17h.01"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
  <symbol id="i-sound-off" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5zM16 9.5l5 5M21 9.5l-5 5"/></symbol>
</svg>

<a class="skip-link" href="#main" data-t="app.skip"></a>

<header class="app-header" id="app-header">
  <a class="brand" href="./">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" class="bm-a"/><path d="M16 16V3a13 13 0 0 1 11.3 6.5z" class="bm-b"/><path d="M16 16l11.3-6.5a13 13 0 0 1 0 13z" class="bm-c"/><path d="M16 16l11.3 6.5A13 13 0 0 1 16 29z" class="bm-d"/><circle cx="16" cy="16" r="4" class="bm-e"/></svg>
    <span data-t="app.title"></span>
  </a>
  <nav class="app-nav">
    <button type="button" id="btn-help" class="btn btn-ghost"><svg class="icon" aria-hidden="true"><use href="#i-help"/></svg><span data-t="nav.help"></span></button>
    <button type="button" id="btn-settings" class="btn btn-ghost"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg><span data-t="nav.settings"></span></button>
  </nav>
</header>

<main id="main">

  <!-- 1. Upload -->
  <section id="screen-upload" class="screen screen-upload" aria-labelledby="upload-title">
    <div class="upload-main">
      <h1 id="upload-title" tabindex="-1" data-t="upload.title"></h1>
      <p class="lead" data-t="upload.lead"></p>
      <label id="dropzone" class="dropzone" for="file-input">
        <svg class="icon icon-xl" aria-hidden="true"><use href="#i-upload"/></svg>
        <span class="dz-title" data-t="upload.drop"></span>
        <span class="dz-or" data-t="upload.or"></span>
        <span class="btn btn-primary btn-lg dz-button"><svg class="icon" aria-hidden="true"><use href="#i-image"/></svg><span data-t="upload.choose"></span></span>
        <span class="dz-note" data-t="upload.paste"></span>
        <span class="dz-note" data-t="upload.formats"></span>
        <input id="file-input" class="visually-hidden" type="file" accept="image/*">
      </label>
      <p id="phone-option" class="phone-option">
        <button type="button" id="btn-phone" class="btn btn-lg"><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg><span data-t="upload.phone"></span></button>
      </p>
      <p class="privacy-line"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg><span data-t="upload.privacy"></span></p>
      <p id="upload-error" class="form-error" role="alert" hidden></p>
    </div>
    <aside class="tips card" aria-labelledby="tips-title">
      <h2 id="tips-title" data-t="upload.tips.title"></h2>
      <ul>
        <li data-t="upload.tips.1"></li>
        <li data-t="upload.tips.2"></li>
        <li data-t="upload.tips.3"></li>
        <li data-t="upload.tips.4"></li>
      </ul>
    </aside>
  </section>

  <!-- 2. Review faces -->
  <section id="screen-review" class="screen screen-review" aria-labelledby="review-title" hidden>
    <div class="screen-head">
      <ol class="steps" data-t-attr="aria-label:steps.label">
        <li data-t="steps.upload"></li>
        <li aria-current="step" data-t="steps.review"></li>
        <li data-t="steps.spin"></li>
      </ol>
      <button type="button" id="btn-start-over" class="btn btn-ghost"><svg class="icon" aria-hidden="true"><use href="#i-spin"/></svg><span data-t="review.startOver"></span></button>
    </div>
    <h1 id="review-title" tabindex="-1" data-t="review.title"></h1>
    <p class="lead" data-t="review.lead"></p>

    <div class="review-grid">
      <div class="photo-pane">
        <div class="photo-toolbar" role="toolbar" data-t-attr="aria-label:review.photo">
          <button type="button" id="btn-add-face" class="btn" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span id="add-face-label" data-t="review.add"></span></button>
          <span class="toolbar-gap"></span>
          <button type="button" id="btn-zoom-out" class="btn btn-icon" data-t-attr="aria-label:review.zoomOut;title:review.zoomOut"><svg class="icon" aria-hidden="true"><use href="#i-minus"/></svg></button>
          <button type="button" id="btn-zoom-in" class="btn btn-icon" data-t-attr="aria-label:review.zoomIn;title:review.zoomIn"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
          <button type="button" id="btn-zoom-fit" class="btn btn-icon" data-t-attr="aria-label:review.fit;title:review.fit"><svg class="icon" aria-hidden="true"><use href="#i-fit"/></svg></button>
          <span class="toolbar-gap"></span>
          <button type="button" id="btn-undo" class="btn btn-icon" data-t-attr="aria-label:review.undo;title:review.undo" disabled><svg class="icon" aria-hidden="true"><use href="#i-undo"/></svg></button>
          <button type="button" id="btn-redo" class="btn btn-icon" data-t-attr="aria-label:review.redo;title:review.redo" disabled><svg class="icon" aria-hidden="true"><use href="#i-redo"/></svg></button>
        </div>
        <div id="photo-viewport" class="photo-viewport">
          <canvas id="photo-canvas" tabindex="0" role="img" data-t-attr="aria-label:review.photoAria"></canvas>
          <div id="detect-overlay" class="detect-overlay" hidden>
            <div class="detect-card">
              <div id="detect-busy">
                <p id="detect-label" class="detect-label" role="status"></p>
                <progress id="detect-progress" max="100" value="0"></progress>
                <button type="button" id="btn-detect-cancel" class="btn btn-ghost" data-t="detect.cancel"></button>
              </div>
              <div id="detect-failed" hidden>
                <p class="detect-label"><svg class="icon" aria-hidden="true"><use href="#i-warn"/></svg> <span id="detect-error-text" role="alert"></span></p>
                <button type="button" id="btn-detect-retry" class="btn btn-primary" data-t="detect.retry"></button>
              </div>
            </div>
          </div>
        </div>
        <p id="photo-hint" class="hint" data-t="review.photoHint"></p>
      </div>

      <div class="faces-pane">
        <p id="review-summary" class="summary" role="status"></p>
        <div class="control-row">
          <div class="field">
            <label for="sens-range" data-t="review.sensitivity"></label>
            <div class="range-row">
              <input id="sens-range" type="range" min="0" max="3" step="1" value="1">
              <output id="sens-output" for="sens-range"></output>
            </div>
            <p class="help" data-t="review.sensitivityHelp"></p>
          </div>
          <div class="field field-narrow">
            <label for="expected-input" data-t="review.expected"></label>
            <input id="expected-input" type="number" min="1" max="500" inputmode="numeric">
          </div>
        </div>
        <p id="expected-warning" class="warning" role="status" hidden></p>
        <div class="bulk" role="group" data-t-attr="aria-label:review.bulk">
          <button type="button" id="btn-include-all" class="btn btn-small" data-t="review.includeAll"></button>
          <button type="button" id="btn-include-none" class="btn btn-small" data-t="review.includeNone"></button>
          <button type="button" id="btn-off-small" class="btn btn-small" data-t="review.offSmall"></button>
          <button type="button" id="btn-off-low" class="btn btn-small" data-t="review.offLow"></button>
        </div>
        <ul id="face-grid" class="face-grid"></ul>
      </div>
    </div>

    <div class="review-actions">
      <p id="build-note" class="hint" hidden></p>
      <button type="button" id="btn-build" class="btn btn-primary btn-xl"></button>
    </div>
  </section>

  <!-- 3. The wheel -->
  <section id="screen-wheel" class="screen screen-wheel" aria-labelledby="wheel-title" hidden>
    <div class="screen-head">
      <h1 id="wheel-title" tabindex="-1" data-t="wheel.title"></h1>
      <div class="head-actions">
        <button type="button" id="btn-sound" class="btn btn-ghost" aria-pressed="true"><svg class="icon" aria-hidden="true"><use id="sound-icon" href="#i-sound"/></svg><span data-t="wheel.sound"></span></button>
        <button type="button" id="btn-edit-faces" class="btn btn-ghost"><svg class="icon" aria-hidden="true"><use href="#i-pencil"/></svg><span data-t="wheel.edit"></span></button>
        <button type="button" id="btn-present" class="btn btn-ghost"><svg class="icon" aria-hidden="true"><use href="#i-fit"/></svg><span data-t="wheel.present"></span></button>
      </div>
    </div>

    <div class="wheel-grid">
      <div class="wheel-pane">
        <div id="wheel-box" class="wheel-box">
          <canvas id="wheel-canvas" role="img"></canvas>
          <button type="button" id="btn-spin" class="spin-hub"><span data-t="wheel.spin"></span></button>
        </div>
        <div class="result-bar">
          <p id="result-text" class="result-text"></p>
          <p id="result-hint" class="hint" hidden data-t="wheel.hint"></p>
          <div class="result-actions">
            <button type="button" id="btn-enlarge" class="btn btn-primary btn-xl" hidden><svg class="icon" aria-hidden="true"><use href="#i-zoom"/></svg><span data-t="wheel.enlarge"></span></button>
            <button type="button" id="btn-reset-inline" class="btn btn-primary btn-lg" hidden data-t="wheel.resetPicks"></button>
          </div>
        </div>
      </div>

      <aside id="roster-pane" class="roster-pane card" aria-labelledby="roster-title">
        <h2 id="roster-title"></h2>
        <ul id="roster-list" class="roster-list"></ul>
        <button type="button" id="btn-reset-picks" class="btn btn-small"><svg class="icon" aria-hidden="true"><use href="#i-spin"/></svg><span data-t="wheel.resetPicks"></span></button>
        <section class="history" aria-labelledby="history-title">
          <h3 id="history-title" data-t="history.title"></h3>
          <ol id="history-list" class="history-list"></ol>
          <p id="history-empty" class="hint" data-t="history.empty"></p>
        </section>
      </aside>
    </div>
    <button type="button" id="btn-exit-present" class="btn present-exit" hidden><svg class="icon" aria-hidden="true"><use href="#i-exit-fit"/></svg><span data-t="wheel.exitPresent"></span></button>
  </section>

</main>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

<!-- The pop-out: the enlarged face -->
<dialog id="popout" class="popout" aria-labelledby="popout-caption">
  <div id="popout-card" class="popout-card">
    <button type="button" id="popout-close" class="btn btn-icon popout-x" data-t-attr="aria-label:popout.close;title:popout.close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
    <p id="popout-preview" class="chip" hidden data-t="popout.preview"></p>
    <div id="popout-media" class="popout-media">
      <canvas id="popout-face" class="popout-canvas" role="img"></canvas>
      <canvas id="popout-context" class="popout-canvas" role="img" hidden></canvas>
    </div>
    <p id="popout-caption" class="popout-caption"></p>
    <p id="popout-note" class="popout-note" hidden><svg class="icon" aria-hidden="true"><use href="#i-warn"/></svg><span data-t="popout.lowRes"></span></p>
    <div class="popout-actions">
      <button type="button" id="popout-context-toggle" class="btn"><svg class="icon" aria-hidden="true"><use href="#i-image"/></svg><span id="popout-context-label" data-t="popout.showContext"></span></button>
      <button type="button" id="popout-remove" class="btn"><svg class="icon" aria-hidden="true"><use href="#i-user-minus"/></svg><span data-t="popout.remove"></span></button>
      <button type="button" id="popout-spin" class="btn btn-primary"><svg class="icon" aria-hidden="true"><use href="#i-spin"/></svg><span data-t="popout.spinAgain"></span></button>
    </div>
  </div>
</dialog>

<dialog id="settings-dialog" class="sheet" aria-labelledby="settings-title">
  <form method="dialog" class="sheet-body">
    <div class="sheet-head">
      <h2 id="settings-title" data-t="settings.title"></h2>
      <button type="submit" class="btn btn-icon" data-t-attr="aria-label:common.close;title:common.close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <fieldset>
      <legend data-t="settings.afterPick"></legend>
      <label class="choice"><input type="radio" name="afterPick" value="keep"><span data-t="settings.keep"></span></label>
      <label class="choice"><input type="radio" name="afterPick" value="remove"><span data-t="settings.remove"></span></label>
    </fieldset>
    <fieldset>
      <legend data-t="settings.spinLength"></legend>
      <label class="choice"><input type="radio" name="spinDuration" value="short"><span data-t="settings.short"></span></label>
      <label class="choice"><input type="radio" name="spinDuration" value="normal"><span data-t="settings.normal"></span></label>
      <label class="choice"><input type="radio" name="spinDuration" value="long"><span data-t="settings.long"></span></label>
    </fieldset>
    <fieldset>
      <legend data-t="settings.sound"></legend>
      <label class="choice"><input type="checkbox" name="sound"><span data-t="settings.soundOn"></span></label>
    </fieldset>
    <fieldset>
      <legend data-t="settings.theme"></legend>
      <label class="choice"><input type="radio" name="theme" value="system"><span data-t="settings.system"></span></label>
      <label class="choice"><input type="radio" name="theme" value="light"><span data-t="settings.light"></span></label>
      <label class="choice"><input type="radio" name="theme" value="dark"><span data-t="settings.dark"></span></label>
    </fieldset>
    <div class="danger-zone">
      <button type="button" id="btn-delete-data" class="btn btn-danger" data-t="settings.deleteAll"></button>
      <p class="help" data-t="settings.deleteHelp"></p>
    </div>
  </form>
</dialog>

<dialog id="pair-dialog" class="sheet pair-sheet" aria-labelledby="pair-title">
  <div class="sheet-body">
    <div class="sheet-head">
      <h2 id="pair-title" data-t="pair.title"></h2>
      <button type="button" id="pair-close" class="btn btn-icon" data-t-attr="aria-label:common.close;title:common.close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div id="pair-holder"></div>
  </div>
</dialog>

<dialog id="help-dialog"class="sheet" aria-labelledby="help-title">
  <form method="dialog" class="sheet-body">
    <div class="sheet-head">
      <h2 id="help-title" data-t="help.title"></h2>
      <button type="submit" class="btn btn-icon" data-t-attr="aria-label:common.close;title:common.close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <ol class="help-steps">
      <li data-t="help.1"></li>
      <li data-t="help.2"></li>
      <li data-t="help.3"></li>
      <li data-t="help.4"></li>
    </ol>
    <h3 data-t="help.privacy.title"></h3>
    <ul>
      <li data-t="help.privacy.1"></li>
      <li data-t="help.privacy.2"></li>
      <li data-t="help.privacy.3"></li>
    </ul>
    <h3 data-t="help.keys.title"></h3>
    <ul>
      <li data-t="help.keys.1"></li>
      <li data-t="help.keys.2"></li>
      <li data-t="help.keys.3"></li>
    </ul>
  </form>
</dialog>

<dialog id="notice-dialog" class="sheet sheet-small" aria-labelledby="notice-title">
  <form method="dialog" class="sheet-body">
    <h2 id="notice-title" data-t="notice.title"></h2>
    <p data-t="notice.body"></p>
    <div class="sheet-actions"><button type="submit" class="btn btn-primary" data-t="notice.ok"></button></div>
  </form>
</dialog>

<div id="unsupported" class="unsupported" role="alert" hidden>
  <h1 data-t="unsupported.title"></h1>
  <p data-t="unsupported.body"></p>
</div>

<template id="tpl-face-card">
  <li class="face-card">
    <div class="face-thumb">
      <canvas width="192" height="192"></canvas>
      <span class="face-num"></span>
      <span class="face-badge" hidden></span>
    </div>
    <div class="face-body">
      <div class="face-row">
        <label class="switch"><input type="checkbox" class="face-include"><span class="switch-track" aria-hidden="true"></span><span class="switch-text" data-t="face.include"></span></label>
        <button type="button" class="btn btn-icon btn-ghost face-delete"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg></button>
      </div>
      <input type="text" class="face-label" maxlength="40" autocomplete="off" spellcheck="false">
    </div>
  </li>
</template>

<template id="tpl-roster-row">
  <li class="roster-row">
    <button type="button" class="roster-main">
      <canvas width="96" height="96"></canvas>
      <span class="roster-name"></span>
      <span class="roster-status"></span>
    </button>
    <label class="switch switch-small"><input type="checkbox" class="roster-include"><span class="switch-track" aria-hidden="true"></span></label>
  </li>
</template>

<script type="module" src="js/main.js"></script>
<script nomodule src="js/nomodule.js"></script>
</body>
</html>
